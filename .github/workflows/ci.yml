name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  build:
    name: Build and smoke-test installed wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Run the installed CLI (not the source tree)
        working-directory: /tmp
        run: |
          /tmp/clean/bin/envmirror --version
          /tmp/clean/bin/envmirror scan --no-project --output /tmp/snap.json
          /tmp/clean/bin/envmirror validate /tmp/snap.json
          /tmp/clean/bin/envmirror compare "$GITHUB_WORKSPACE/examples/machine-a.json" "$GITHUB_WORKSPACE/examples/machine-b.json" --fail-on none --html /tmp/report.html
          test -s /tmp/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
